<!DOCTYPE html>
<html>
<head>
    <title>Zombie Slayer</title>
    <style>
        body {
            background: #222;
            color: white;
            text-align: center;
            font-family: Arial;
        }

        #game {
            position: relative;
            height: 300px;
            background: #555;
            overflow: hidden;
            border-bottom: 20px solid #222;
        }

        #player {
            position: absolute;
            left: 80px;
            bottom: 0;
            font-size: 60px;
        }

        #zombie {
            position: absolute;
            bottom: 0;
            width: 70px;
            height: 90px;
        }

        button {
            padding: 12px 25px;
            margin: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Zombie Slayer</h1>
    <h3>Score: <span id="score">0</span>
        | Health: <span id="health">3</span></h3>

    <div id="game">
        <div id="player">🧍</div>
        <img id="zombie" src="zombie.gif" alt="Zombie">
    </div>

    <button onclick="attack()">⚔️ SLASH</button>

    <script>
        let score = 0;
        let health = 3;
        let zombieX = 700;
        let running = true;

        const zombie = document.getElementById("zombie");

        function attack() {
            if (!running) return;

            if (zombieX < 250) {
                score += 10;
                zombieX = 700;
                document.getElementById("score").textContent = score;
            }
        }

        setInterval(() => {
            if (!running) return;

            zombieX -= 5;
            zombie.style.left = zombieX + "px";

            if (zombieX < 100) {
                health--;
                zombieX = 700;

                document.getElementById("health").textContent = health;

                if (health <= 0) {
                    running = false;
                    alert("Game Over! Score: " + score);
                }
            }
        }, 50);
    </script>

</body>
</html>
